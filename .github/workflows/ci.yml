name: Check AllHail
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check native Node TypeScript support
        run: node -e "import('./server.ts').then(() => console.log('OK'))"
      - run: npm run smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
